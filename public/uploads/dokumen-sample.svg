<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="docbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="folderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#docbg)"/>
  <!-- Folder -->
  <g transform="translate(150, 70)">
    <!-- Back folder tab -->
    <path d="M 0 30 L 100 30 L 130 50 L 300 50 L 300 260 L 0 260 Z" fill="#7f1d1d"/>
    <!-- Papers peeking -->
    <rect x="25" y="15" width="240" height="230" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="45" y1="40" x2="180" y2="40" stroke="#0284c7" stroke-width="4"/>
    <line x1="45" y1="55" x2="240" y2="55" stroke="#94a3b8" stroke-width="2"/>
    <line x1="45" y1="70" x2="220" y2="70" stroke="#94a3b8" stroke-width="2"/>
    <!-- Front folder cover -->
    <rect x="0" y="55" width="300" height="205" rx="8" fill="url(#folderRed)" stroke="#ef4444" stroke-width="1.5"/>
    <!-- Label Badge -->
    <rect x="35" y="100" width="230" height="85" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
    <text x="150" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#991b1b" text-anchor="middle">BERKAS BIMBINGAN SKRIPSI</text>
    <text x="150" y="145" font-family="Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle">PROGRAM STUDI TEKNIK INFORMATIKA</text>
    <text x="150" y="165" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">TRANSKRIP NILAI RESMI</text>
  </g>
</svg>
