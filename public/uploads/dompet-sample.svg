<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="walbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#292524" />
    </linearGradient>
    <linearGradient id="leather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#walbg)"/>
  <!-- Wallet Body -->
  <g transform="translate(130, 80)">
    <!-- Back leather fold -->
    <rect x="0" y="20" width="340" height="230" rx="20" fill="#451a03" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4"/>
    <!-- Front flap -->
    <rect x="15" y="40" width="310" height="195" rx="16" fill="url(#leather)" stroke="#d97706" stroke-width="1.5"/>
    <!-- Stitching line -->
    <rect x="22" y="47" width="296" height="181" rx="12" fill="none" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="5,4" opacity="0.6"/>
    <!-- Card peek slots -->
    <rect x="40" y="70" width="120" height="35" rx="4" fill="#0284c7" stroke="#38bdf8" stroke-width="1"/>
    <text x="50" y="92" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">FLAZZ BCA</text>
    <rect x="40" y="90" width="120" height="35" rx="4" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="50" y="112" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">KTP REPUBLIK</text>
    <!-- Brand Emboss -->
    <text x="250" y="205" font-family="Georgia, serif" font-size="16" font-weight="bold" fill="#b45309" letter-spacing="1">BAELLERRY</text>
  </g>
</svg>
