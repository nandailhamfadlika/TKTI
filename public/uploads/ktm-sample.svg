  <text x="265" y="218" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">NIM : 0110221045</text>
  <text x="265" y="240" font-family="Arial, sans-serif" font-size="12" fill="#94a3b8">PRODI : TEKNIK INFORMATIKA</text>
