<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="kbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#kbg)"/>
  <!-- Keyring -->
  <circle cx="280" cy="180" r="45" fill="none" stroke="#cbd5e1" stroke-width="12" />
  <!-- Motor Key Head -->
  <path d="M 270 145 L 340 100 C 370 120, 370 170, 340 190 Z" fill="#0f172a" stroke="#475569" stroke-width="3" />
  <circle cx="310" cy="145" r="8" fill="#f43f5e" />
  <!-- Key Blade -->
  <path d="M 340 140 L 460 140 L 460 152 L 440 152 L 435 158 L 420 152 L 405 160 L 390 152 L 340 152 Z" fill="url(#metal)" stroke="#475569" stroke-width="1" />
  <!-- Bear Keychain -->
  <g transform="translate(140, 160)">
    <!-- Chain links -->
    <ellipse cx="100" cy="30" rx="8" ry="14" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <ellipse cx="100" cy="50" rx="8" ry="14" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <!-- Bear ears -->
    <circle cx="75" cy="85" r="18" fill="#78350f" />
    <circle cx="75" cy="85" r="10" fill="#fde68a" />
    <circle cx="125" cy="85" r="18" fill="#78350f" />
    <circle cx="125" cy="85" r="10" fill="#fde68a" />
    <!-- Bear head -->
    <circle cx="100" cy="115" r="38" fill="#92400e" stroke="#78350f" stroke-width="3" />
    <!-- Muzzle -->
    <ellipse cx="100" cy="125" rx="18" ry="14" fill="#fef3c7" />
    <circle cx="100" cy="118" r="5" fill="#1e293b" />
    <!-- Eyes -->
    <circle cx="86" cy="108" r="4" fill="#0f172a" />
    <circle cx="114" cy="108" r="4" fill="#0f172a" />
    <!-- Label Tag -->
    <rect x="55" y="165" width="90" height="24" rx="6" fill="#f59e0b" />
    <text x="100" y="181" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">HONDA BEAT</text>
  </g>
</svg>
